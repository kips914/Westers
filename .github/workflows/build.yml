name: Build mod

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  MOD_NAME: MilitechHope
  WOLVENKIT_VERSION: 10.0.0-beta.1

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate sources
        shell: pwsh
        run: python tools/validate.py

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download WolvenKit CLI
        shell: pwsh
        run: |
          $url = "https://github.com/WolvenKit/WolvenKit/releases/download/$env:WOLVENKIT_VERSION/WolvenKit.Console-$env:WOLVENKIT_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile wk.zip
          Expand-Archive wk.zip -DestinationPath wk
          $cli = Get-ChildItem wk -Recurse -Filter WolvenKit.CLI.exe | Select-Object -First 1
          if (-not $cli) { Get-ChildItem wk -Recurse | Select-Object -First 50 FullName; throw "WolvenKit.CLI.exe not found" }
          # UI icon texture settings for `import`
          $settings = @{
            Logging = @{ LogLevel = @{ Default = "Information"; Microsoft = "Warning"; "Microsoft.Hosting.Lifetime" = "Warning" } }
            XbmExportArgs = @{ UncookExtension = "dds" }
            XbmImportArgs = @{
              TextureGroup = "TEXG_Generic_UI"
              RawFormat = "TRF_TrueColor"
              Compression = "TCM_DXTAlpha"
              GenerateMipMaps = $false
              IsStreamable = $false
              PremultiplyAlpha = $false
              IsGamma = $true
            }
          }
          $settings | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $cli.DirectoryName "appsettings.json")
          "WKIT=$($cli.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $cli.FullName --version

      - name: Build archive (icon)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pack = "build/$env:MOD_NAME"
          $icons = "$pack/militech_hope/icons"
          New-Item -ItemType Directory -Force $icons | Out-Null

          # Sandevistan icon + six upgrade module icons (one xbm + inkatlas each)
          $names = Get-ChildItem "source/raw/militech_hope/icons" -Filter "militech_hope_*.png" | ForEach-Object { $_.BaseName }
          foreach ($n in $names) {
            & $env:WKIT import "source/raw/militech_hope/icons/$n.png" -o $icons
            & $env:WKIT convert deserialize "source/archive/militech_hope/icons/$n.inkatlas.json" -o $icons
          }

          # check what the CLI produced
          Get-ChildItem $icons | ForEach-Object { Write-Host "  $($_.Name)  $($_.Length) bytes" }
          foreach ($n in $names) {
            if (-not (Test-Path "$icons/$n.xbm")) { throw "$n.xbm was not produced" }
            if (-not (Test-Path "$icons/$n.inkatlas")) { throw "$n.inkatlas was not produced" }
          }
          if ($names.Count -lt 7) { throw "expected 7 icons, got $($names.Count)" }
          Get-ChildItem $icons -File | Where-Object { $_.Extension -notin '.xbm', '.inkatlas' } | Remove-Item -Force

          New-Item -ItemType Directory -Force build/out | Out-Null
          & $env:WKIT pack $pack -o build/out
          Get-ChildItem build/out | ForEach-Object { Write-Host "  $($_.Name)  $($_.Length) bytes" }
          if (-not (Test-Path "build/out/$env:MOD_NAME.archive")) { throw "archive was not produced" }

      - name: Report archive contents
        shell: pwsh
        run: |
          $icons = "build/$env:MOD_NAME/militech_hope/icons"
          foreach ($f in Get-ChildItem $icons, build/out -File) { Write-Host "::notice title=file::$($f.Name) $($f.Length) bytes" }
          $list = (& $env:WKIT archive "build/out/$env:MOD_NAME.archive" -l) -join " | "
          Write-Host "::notice title=archive::$list"
          New-Item -ItemType Directory -Force build/check | Out-Null
          & $env:WKIT convert serialize "$icons/militech_hope_sandevistan.xbm" -o build/check | Out-Null
          $json = Get-ChildItem build/check -Recurse -Filter *.json | Select-Object -First 1
          if ($json) {
            $root = (Get-Content $json.FullName -Raw | ConvertFrom-Json).Data.RootChunk
            Write-Host "::notice title=xbm::$($root.width)x$($root.height) group=$($root.setup.group) compression=$($root.setup.compression) gamma=$($root.setup.isGamma) mips=$($root.setup.hasMipchain)"
          }

      - name: Assemble package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $stage = "build/package"
          New-Item -ItemType Directory -Force "$stage/archive/pc/mod" | Out-Null
          Copy-Item "build/out/$env:MOD_NAME.archive" "$stage/archive/pc/mod/"
          Copy-Item -Recurse src/r6 $stage
          Copy-Item -Recurse src/bin $stage
          Copy-Item README.md "$stage/MilitechHope_README.md"
          Set-Content -Encoding ascii "$stage/r6/scripts/MilitechHope/VERSION.txt" $version
          $zip = "build/${env:MOD_NAME}_Sandevistan_$version.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem $stage -Recurse -File | ForEach-Object { $_.FullName.Substring((Resolve-Path $stage).Path.Length) }

      - name: Build installer (exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force installer/payload | Out-Null
          Copy-Item $env:ZIP installer/payload/MilitechHope.zip
          dotnet build installer/MilitechHopeInstaller.csproj -c Release -o build/installer -nologo
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          Copy-Item build/installer/MilitechHopeInstaller.exe build/MilitechHope_Installer.exe
          $size = (Get-Item build/MilitechHope_Installer.exe).Length
          Write-Host "::notice title=installer::MilitechHope_Installer.exe $size bytes"
          "INSTALLER=build/MilitechHope_Installer.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test installer on a fake game folder
        shell: pwsh
        run: |
          $game = Join-Path $env:RUNNER_TEMP "Cyberpunk 2077"
          New-Item -ItemType Directory -Force (Join-Path $game "bin\x64") | Out-Null
          Set-Content (Join-Path $game "bin\x64\Cyberpunk2077.exe") "fake"
          $log = Join-Path $env:RUNNER_TEMP "install.log"
          $p = Start-Process $env:INSTALLER -ArgumentList @("--silent", "--all", "--game", "`"$game`"", "--log", "`"$log`"") -Wait -PassThru
          $text = (Get-Content $log -Encoding utf8) -join " | "
          Write-Host "::notice title=installer log (exit $($p.ExitCode))::$text"

          $tree = Get-ChildItem $game -Recurse -File | ForEach-Object { $_.FullName.Substring($game.Length + 1) } |
            ForEach-Object { ($_ -split '\\')[0..([Math]::Min(2, ($_ -split '\\').Length - 1))] -join '\' } | Sort-Object -Unique
          Write-Host "::notice title=installed tree::$($tree -join ' | ')"

          $expect = @(
            "red4ext\RED4ext.dll", "red4ext\plugins\TweakXL", "red4ext\plugins\Codeware", "red4ext\plugins\ArchiveXL",
            "bin\x64\plugins\cyber_engine_tweaks.asi", "archive\pc\mod\MilitechHope.archive",
            "r6\tweaks\MilitechHope\militech_hope.tweak", "r6\scripts\MilitechHope\HopeSystem.reds",
            "bin\x64\plugins\cyber_engine_tweaks\mods\MilitechHope\init.lua"
          )
          $missing = $expect | Where-Object { -not (Test-Path (Join-Path $game $_)) }
          if ($missing) { throw "missing after install: $($missing -join ', ')" }
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }

          if (-not (Test-Path (Join-Path $game "r6\scripts\MilitechHope\VERSION.txt"))) { throw "VERSION.txt missing after install" }

          # update: downloads the latest published release from GitHub
          $ulog = Join-Path $env:RUNNER_TEMP "update.log"
          $pu = Start-Process $env:INSTALLER -ArgumentList @("--silent", "--update", "--force", "--game", "`"$game`"", "--log", "`"$ulog`"") -Wait -PassThru
          $utext = (Get-Content $ulog -Encoding utf8) -join " | "
          Write-Host "::notice title=update log (exit $($pu.ExitCode))::$utext"
          if ($pu.ExitCode -ne 0) { throw "update failed" }
          if (-not (Test-Path (Join-Path $game "r6\scripts\MilitechHope\HopeSystem.reds"))) { throw "mod missing after update" }

          # uninstall must remove only the mod
          $p2 = Start-Process $env:INSTALLER -ArgumentList @("--silent", "--uninstall", "--game", "`"$game`"") -Wait -PassThru
          if ($p2.ExitCode -ne 0 -or (Test-Path (Join-Path $game "r6\tweaks\MilitechHope")) -or -not (Test-Path (Join-Path $game "red4ext\RED4ext.dll"))) { throw "uninstall check failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: MilitechHope-package
          path: |
            ${{ env.ZIP }}
            ${{ env.INSTALLER }}

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Militech «Надежда» Sandevistan ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ env.ZIP }}
            ${{ env.INSTALLER }}
